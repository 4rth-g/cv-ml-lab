name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest
        run: uv run pytest

  # Camada de análise (R). Job separado de propósito: `analysis/` só depende do
  # contrato de arquivos, nunca de código Python, então as duas suítes não
  # precisam do mesmo ambiente.
  #
  # Deliberadamente SEM Nix aqui: construir o rWrapper sem cache leva dezenas de
  # minutos. O flake é para a máquina de desenvolvimento; no CI bastam os
  # pacotes, porque os testes são valores fixos sobre funções puras.
  r-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: analysis
          extra-packages: |
            any::devtools
            any::testthat

      - name: Run testthat
        run: Rscript -e 'devtools::test("analysis", stop_on_failure = TRUE)'
