[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvlab"
version = "0.1.0"
description = "Framework dataset-agnóstico de visão computacional com tuning rigoroso (Lightning + Hydra + Optuna + W&B)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision",
    "lightning>=2.2.0",
    "hydra-core>=1.3.0",
    "omegaconf",
    "wandb",
    "optuna>=3.5.0",
    "torchmetrics",
    # >=3.0 para o parâmetro `size` (MedMNIST+: 28/64/128/224).
    "medmnist>=3.0",
    "numpy",
]

[project.scripts]
cvlab-train = "cvlab.train:main"
cvlab-eda = "cvlab.eda:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cvlab"]

[tool.ruff]
line-length = 120
# .virtual_documents: gerado pelo jupyter-lsp durante a sessão do JupyterLab.
# notebooks/: os .ipynb usam kernel R, e o ruff os analisaria como Python.
extend-exclude = [".virtual_documents", "notebooks"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
