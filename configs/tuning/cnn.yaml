# Espaço de busca da CNN. O ORÇAMENTO da busca (n_trials, épocas, seeds) vem do
# grupo `tuning/budget` — troque com `tuning/budget=smoke|default|long`.
defaults:
  - budget: default
  - _self_

search_space:
  num_filters: {type: categorical, choices: [16, 32, 64, 128]}
  dropout_rate: {type: float, low: 0.0, high: 0.6}
  fc_units: {type: categorical, choices: [64, 128, 256, 512]}
  n_conv_blocks: {type: categorical, choices: [2, 3]}
  lr: {type: float, low: 1e-4, high: 5e-3, log: true}
  batch_size: {type: categorical, choices: [32, 64, 128]}
  optimizer: {type: categorical, choices: [adam, adamw, sgd]}
  weight_decay: {type: float, low: 1e-6, high: 1e-2, log: true}
