# Espaço de busca da ResNet. O ORÇAMENTO vem do grupo `tuning/budget`
# (`tuning/budget=smoke|default|long`). A ResNet é ~7x mais cara por época que a
# CNN, então `long` aqui custa horas — meça antes de assumir.
defaults:
  - budget: default
  - _self_

search_space:
  width: {type: categorical, choices: [16, 32, 64]}
  blocks_per_stage: {type: categorical, choices: [1, 2, 3]}
  n_stages: {type: categorical, choices: [2, 3]}
  lr: {type: float, low: 1e-3, high: 2e-1, log: true}
  batch_size: {type: categorical, choices: [64, 128, 256]}
  optimizer: {type: categorical, choices: [sgd, adamw]}
  weight_decay: {type: float, low: 1e-5, high: 1e-2, log: true}
  # O scheduler é hiperparâmetro, não decisão de código: a busca e a comparação
  # multi-seed é que dizem se o decay de LR vale a pena nesta arquitetura.
  scheduler: {type: categorical, choices: [none, cosine, step]}

# Métrica que a busca maximiza E que decide baseline-vs-tunada em
# `rigorous_compare`. NÃO é a métrica de relatório: a coluna `acc` do export é
# sempre acurácia simples (micro), em todo split. Ver `cvlab.metrics`.
#
# `accuracy` preserva o protocolo histórico. Use `balanced_accuracy` em datasets
# desbalanceados (DermaMNIST tem razão 58,7): lá a acurácia simples é maximizada
# ignorando as classes raras, e a escolha de config sairia guiada pela classe
# majoritária. O valor vai ao manifest, então o relatório declara o critério.
objective: accuracy
