n_trials: 40
epochs_gs: 10
gs_subset_size: 20000
n_seeds: 5
final_epochs: 10

search_space:
  num_filters: [16, 32, 64, 128]
  dropout_rate: [0.0, 0.6]
  fc_units: [64, 128, 256, 512]
  n_conv_blocks: [2, 3]
  lr: [1e-4, 5e-3]
  batch_size: [32, 64, 128]
  optimizer: ["adam", "adamw", "sgd"]
  weight_decay: [1e-6, 1e-2]
