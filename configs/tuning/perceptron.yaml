# Espaço de busca do perceptron linear. O ORÇAMENTO da busca (n_trials, épocas,
# seeds) vem do grupo `tuning/budget` — `tuning/budget=smoke|default|long`.
defaults:
  - budget: default
  - _self_

# O perceptron linear não tem hiperparâmetros de arquitetura; só se busca o treino.
search_space:
  lr: {type: float, low: 1e-4, high: 1e-2, log: true}
  batch_size: {type: categorical, choices: [32, 64, 128]}
  optimizer: {type: categorical, choices: [adam, adamw, sgd]}
  weight_decay: {type: float, low: 1e-6, high: 1e-2, log: true}
